<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Arcade HTML5</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; padding: 20px; margin: 0; }
        header { display: flex; flex-direction: column; gap: 15px; max-width: 1200px; margin: 0 auto 20px auto; }
        h1 { text-align: center; color: #00e676; margin: 0; }
        .controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 6px; border: none; font-size: 16px; background: #1e1e1e; color: #fff; border: 1px solid #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 8px; text-align: center; text-decoration: none; color: #fff; font-weight: bold; border: 1px solid #333; display: flex; align-items: center; justify-content: center; height: 50px; }
        .card:hover { background: #00e676; color: #000; border-color: #00e676; }
    </style>
</head>
<body>
    <header>
        <h1>Mi Arcade HTML5 🎮</h1>
        <div class="controls">
            <input type="text" id="search" onkeyup="filterGames()" placeholder="Buscar entre los juegos...">
        </div>
    </header>

    <div class="grid" id="game-list">
        <!-- Reemplaza o agrega aquí los enlaces con los nombres exactos de tus archivos de juegos sueltos -->
        <a class="card" href="./1.5.html" target="_blank">Juego 1.5</a>
        <a class="card" href="./1.8.html" target="_blank">Juego 1.8</a>
        <a class="card" href="./1v1.lol.html" target="_blank">1v1.lol</a>
        <a class="card" href="./2048.html" target="_blank">2048</a>
        <a class="card" href="./agariolite.html" target="_blank">Agario Lite</a>
    </div>

    <script>
        function filterGames() {
            let input = document.getElementById('search').value.toLowerCase();
            let cards = document.getElementsByClassName('card');
            for (let i = 0; i < cards.length; i++) {
                let name = cards[i].innerText.toLowerCase();
                cards[i].style.display = name.includes(input) ? "flex" : "none";
            }
        }
    </script>
</body>
</html>
